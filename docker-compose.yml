services:
  lb:
    image: caddy:2
    volumes:
      - ./load-balancer/Caddyfile:/etc/caddy/Caddyfile
    ports:
      - "8080:80"
    networks:
      - web-net

  web1:
    image: caddy:2
    volumes:
      - ./web1:/srv
    networks:
      - web-net

  web2:
    image: caddy:2
    volumes:
      - ./web2:/srv
    networks:
      - web-net

  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Express"
      MSSQL_SA_PASSWORD: ${SA_PASSWORD}
    volumes:
      - db-data:/var/opt/mssql
      - ./db/init:/init
    networks:
      - data-net
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -Q \"SELECT 1\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

networks:
  web-net:
  data-net:

volumes:
  db-data: